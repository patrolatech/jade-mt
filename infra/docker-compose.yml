name: jade-mt

services:
  postgres:
    image: postgis/postgis:17-3.5
    # This PostGIS image is amd64; Docker Desktop emulates it on Apple Silicon.
    platform: linux/amd64
    environment:
      POSTGRES_USER: jade
      POSTGRES_PASSWORD: jade_dev
      POSTGRES_DB: jade
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/001-postgis.sql:/docker-entrypoint-initdb.d/001-postgis.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jade -d jade']
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
